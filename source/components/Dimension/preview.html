<!doctype html>
<html>
<head><meta charset="utf-8"><title>Dimension — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>.dim-demo{display:inline-grid;gap:var(--space-2)} .dim-box{box-sizing:border-box;width:320px;height:96px;margin-left:6px;border:var(--stroke-hair) dashed var(--ink);display:flex;align-items:center;justify-content:center} .dim-box-label{font-family:var(--font-mono);color:var(--ink-muted)} .dim-row{display:flex;gap:4px}</style>
</head>
<body>
<div id="root" class="ds-demo"></div>
<script>
  var D = window.Dossier, h = React.createElement;
  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'dim-demo' }, h(D.Dimension, { length: 320, label: '320 px' }), h('div', { className: 'dim-box' }, h('span', { className: 'label dim-box-label' }, 'MODULE A')), h('div', { className: 'dim-row' }, h(D.Dimension, { length: 152, label: '152', active: true }), h(D.Dimension, { length: 152, label: '152' }))));
</script>
</body>
</html>
