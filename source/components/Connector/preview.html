<!doctype html>
<html>
<head><meta charset="utf-8"><title>Connector — preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>.stack{display:grid;gap:var(--space-8)} .conn-row{display:flex;align-items:center;gap:var(--space-3)} .conn-word{font-family:var(--font-display);text-transform:uppercase}</style>
