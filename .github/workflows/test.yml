name: Test

# The test suites shared by the PR and Gallery workflows, split into parallel jobs.
# Each job builds what it needs, so none waits for another.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - name: Install
        run: npm ci
      - name: Install React 19 test deps
        run: npm ci --prefix tests/react19
      - name: Build library
        run: npm run build
      - name: Unit tests
        run: npx playwright test --project unit --shard ${{ matrix.shard }}/2
      - name: Keep the test results when a test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-unit-${{ matrix.shard }}
          path: test-results/

  gallery:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
      - name: Install
        run: npm ci
      - name: Build library and gallery
        run: npm run build:gallery
      - name: Gallery tests
        run: npm run test:gallery -- --shard ${{ matrix.shard }}/3
      - name: Keep the test results when a test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-gallery-${{ matrix.shard }}
          path: test-results/

  storybook:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
      - name: Install
        run: npm ci
      - name: Build Storybook
        run: npm run build:storybook
      - name: Storybook tests
        run: npm run test:storybook
      - name: Keep the test results when a test fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-storybook
          path: test-results/
