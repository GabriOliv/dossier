name: PR

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
      - name: Install
        run: npm ci
      - name: Install React 19 test deps
        run: npm ci --prefix tests/react19
      - name: Format
        run: npm run format
      - name: Build library and gallery
        run: npm run build:gallery
      - name: Unit tests
        run: npx playwright test --project unit
      - name: Gallery tests
        run: npm run test:gallery
      - name: Consumer tests (packs the tarball and installs it in the Vite and Docusaurus fixtures)
        run: npm run test:consumer
