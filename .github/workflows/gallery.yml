name: Gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  # Builds the site while the tests run; deploy waits for both.
  build:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v5
      - name: Install
        run: npm ci
      - name: Build library and gallery
        run: npm run build:gallery
      - name: Build Storybook
        run: npm run build:storybook
      - name: Put Storybook next to the gallery
        run: cp -r storybook-static gallery/dist/storybook
      - name: Upload the gallery and Storybook
        uses: actions/upload-pages-artifact@v5
        with:
          path: gallery/dist

  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
